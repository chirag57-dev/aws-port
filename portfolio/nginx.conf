##############################################################################
# Nginx configuration for the React portfolio SPA
# Place this file at /etc/nginx/sites-available/portfolio
# then symlink: sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
##############################################################################

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain or EC2 public IP
    server_name yourdomain.com www.yourdomain.com;

    root /var/www/html;
    index index.html;

    # Charset
    charset utf-8;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"      always;
    add_header X-Content-Type-Options    "nosniff"         always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection          "1; mode=block"  always;

    # Long-lived cache for hashed assets produced by Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router SPA fallback — REQUIRED for /projects/:slug URLs to work
    # when opened directly or when the browser is refreshed on a deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }

    # ── HTTPS ────────────────────────────────────────────────────────────────
    # To enable HTTPS, install Certbot and run:
    #   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
    # Certbot will automatically add the SSL configuration below.
    # ─────────────────────────────────────────────────────────────────────────
}
